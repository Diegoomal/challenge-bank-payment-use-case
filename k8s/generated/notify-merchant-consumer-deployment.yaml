apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/generated/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: notify-merchant-consumer
  name: notify-merchant-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: notify-merchant-consumer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/generated/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: notify-merchant-consumer
    spec:
      containers:
        - args:
            - python
            - consumer.py
          env:
            - name: DATABASE_PATH
              value: /data/notify_merchant.db
            - name: LOG_LEVEL
              value: INFO
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_SERVICE_NAME
              value: notify-merchant-consumer
            - name: RABBITMQ_URL
              value: amqp://challenge:challenge@rabbitmq:5672/%2F
          image: notify-merchant-consumer:latest
          imagePullPolicy: IfNotPresent
          name: notify-merchant-consumer
          volumeMounts:
            - mountPath: /data
              name: notify-merchant-data
      restartPolicy: Always
      volumes:
        - name: notify-merchant-data
          persistentVolumeClaim:
            claimName: notify-merchant-data
