events {}

http {
    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/accounts {
            proxy_pass http://account_service:8002/accounts;
        }

        location = /api/v1/accounts/debit {
            proxy_pass http://debit_account_service:8001/accounts/debit;
        }

        location = /api/v1/payments/start {
            proxy_pass http://start_payment_service:8000/payments/start;
        }

        location = /api/v1/payments/confirm {
            proxy_pass http://confirm_payment_service:8003/payments/confirm;
        }

        location = /api/v1/payments/reverse {
            proxy_pass http://reverse_payment_service:8004/payments/reverse;
        }

        location = /api/v1/notifications/merchant {
            proxy_pass http://notify_merchant_service:8004/notifications/merchant;
        }

        location = /api/v1/notifications/customer {
            proxy_pass http://notify_customer_service:8004/notifications/customer;
        }

        location = /api/v1/receipts {
            proxy_pass http://issue_receipt_service:8000/receipts;
        }
    }
}
