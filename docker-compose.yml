services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bitbank_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bitbank
      RABBITMQ_DEFAULT_PASS: bitbank
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  account_service:
    build:
      context: ./account_service
      dockerfile: dockerfile
    container_name: bitbank_account_service
    environment:
      DATABASE_PATH: /data/account.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    ports:
      - "8002:8002"
    volumes:
      - account_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  start_payment_service:
    build:
      context: ./start_payment_service
      dockerfile: dockerfile
    container_name: bitbank_start_payment_service
    environment:
      DATABASE_PATH: /data/start_payment.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    ports:
      - "8000:8000"
    volumes:
      - start_payment_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  reverse_payment_service:
    build:
      context: ./reverse_payment_service
      dockerfile: dockerfile
    container_name: bitbank_reverse_payment_service
    environment:
      DATABASE_PATH: /data/reverse_payment.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    ports:
      - "8004:8004"
    volumes:
      - reverse_payment_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  reverse_payment_consumer:
    build:
      context: ./reverse_payment_service
      dockerfile: dockerfile
    container_name: bitbank_reverse_payment_consumer
    command: ["python", "consumer.py"]
    environment:
      DATABASE_PATH: /data/reverse_payment.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    volumes:
      - reverse_payment_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  confirm_payment_service:
    build:
      context: ./confirm_payment_service
      dockerfile: dockerfile
    container_name: bitbank_confirm_payment_service
    environment:
      DATABASE_PATH: /data/confirm_payment.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    ports:
      - "8003:8003"
    volumes:
      - confirm_payment_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  confirm_payment_consumer:
    build:
      context: ./confirm_payment_service
      dockerfile: dockerfile
    container_name: bitbank_confirm_payment_consumer
    command: ["python", "consumer.py"]
    environment:
      DATABASE_PATH: /data/confirm_payment.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    volumes:
      - confirm_payment_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  debit_account_service:
    build:
      context: ./debit_account_service
      dockerfile: dockerfile
    container_name: bitbank_debit_account_service
    environment:
      DATABASE_PATH: /data/debit_account.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    ports:
      - "8001:8001"
    volumes:
      - debit_account_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  debit_account_consumer:
    build:
      context: ./debit_account_service
      dockerfile: dockerfile
    container_name: bitbank_debit_account_consumer
    command: ["python", "consumer.py"]
    environment:
      DATABASE_PATH: /data/debit_account.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    volumes:
      - debit_account_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  account_data:
  rabbitmq_data:
  reverse_payment_data:
  start_payment_data:
  confirm_payment_data:
  debit_account_data:
