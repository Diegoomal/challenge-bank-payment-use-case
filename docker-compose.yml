services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bitbank_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bitbank
      RABBITMQ_DEFAULT_PASS: bitbank
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  account_service:
    build:
      context: ./account_service
      dockerfile: dockerfile
    container_name: bitbank_account_service
    environment:
      DATABASE_PATH: /data/account.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
    ports:
      - "8002:8002"
    volumes:
      - account_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  start_payment_service:
    build:
      context: ./start_payment_service
      dockerfile: dockerfile
    container_name: bitbank_start_payment_service
    environment:
      DATABASE_PATH: /data/start_payment.db
