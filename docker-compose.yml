services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bitbank_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bitbank
      RABBITMQ_DEFAULT_PASS: bitbank
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: bitbank_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: bitbank_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bitbank_prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: bitbank_grafana
    environment:
      GF_SECURITY_ADMIN_USER: bitbank
      GF_SECURITY_ADMIN_PASSWORD: bitbank
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  api_gateway:
    image: nginx:alpine
    container_name: bitbank_api_gateway
    ports:
      - "8080:80"
    volumes:
      - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - account_service
      - start_payment_service
      - debit_account_service
      - credit_account_service
      - confirm_payment_service
      - reverse_payment_service
      - notify_merchant_service
      - notify_customer_service
      - issue_receipt_service
    restart: unless-stopped

  account_service:
    build:
      context: .
      dockerfile: account_service/dockerfile
    container_name: bitbank_account_service
    environment:
      DATABASE_PATH: /data/account.db
      RABBITMQ_URL: amqp://bitbank:bitbank@rabbitmq:5672/%2F
      OTEL_SERVICE_NAME: account_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4318
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    volumes:
      - account_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  start_payment_service:
    build:
      context: .
      dockerfile: start_payment_service/dockerfile
    container_name: bitbank_start_payment_service
