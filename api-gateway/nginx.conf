events {}

http {
    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/accounts {
            proxy_pass http://account-service:8002/accounts;
        }

        location = /api/v1/accounts/debit {
            proxy_pass http://debit-account-service:8001/accounts/debit;
        }

        location = /api/v1/accounts/credit {
            proxy_pass http://credit-account-service:8004/accounts/credit;
        }

        location = /api/v1/payments/start {
            proxy_pass http://start-payment-service:8000/payments/start;
        }

        location = /api/v1/payments/confirm {
            proxy_pass http://confirm-payment-service:8003/payments/confirm;
        }

        location = /api/v1/payments/reverse {
            proxy_pass http://reverse-payment-service:8004/payments/reverse;
        }

        location = /api/v1/notifications/merchant {
            proxy_pass http://notify-merchant-service:8004/notifications/merchant;
        }

        location = /api/v1/notifications/customer {
            proxy_pass http://notify-customer-service:8004/notifications/customer;
        }

        location = /api/v1/receipts {
            proxy_pass http://issue-receipt-service:8000/receipts;
        }
    }
}
